version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql84
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      TZ: Asia/Hong_Kong
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql84-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql84-data:
