# ######### EXPIRING KEY/CERT ALERT JOB ######### 
#This property sets the number of days prior to the valid 
#end of keys/certs to be included for an alert warning.
EXPIRING_KEY_CERT_ALERT_DAYS = 10

#This property set the first run time of the expiring key/cert alert
#after server has been restarted.  The display format is HH24:MI. eg. 23:59
