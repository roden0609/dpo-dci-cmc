#This property set the number of times the job is executed in a day, 
#since the time given in EXPIRING_KEY_CERT_PRE_ALERT_FIRST_RUN_TIME_HH24_MI.
EXPIRING_KEY_CERT_ALERT_RUNS_PER_DAY = 24
